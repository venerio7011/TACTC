[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tactc"
version = "0.1.0"
description = "Tissue Adjacency Cross-Check of Transcriptomic Clusters: an independent tissue check of spot-level expression clusters and PAGA graphs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jibum Seo" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "anndata>=0.10",
    "scanpy>=1.10",
    "tifffile>=2024.1",
    "zarr>=2.16",
    "joblib>=1.3",
]

[project.optional-dependencies]
programs = ["torch>=2.1", "pygam", "adjustText", "distinctipy", "fastcluster", "gprofiler-official"]
clustering = ["leidenalg>=0.10", "igraph>=0.11"]

[tool.setuptools]
packages = ["tactc"]
